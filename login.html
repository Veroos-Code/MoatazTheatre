<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Moataz Medhat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <section class="login-section">

        <div class="login-background"></div>

        <div class="login-box">

            <div class="login-logo">MM</div>

            <span class="login-subtitle">MOATAZ MEDHAT</span>

            <div class="login-divider"></div>

            <h1>ADMIN PORTAL</h1>

            <p class="login-description">
                Welcome back. Sign in to manage your theatre portfolio.
            </p>

            <form id="login-form">

                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password"
                        placeholder="Enter your password" required>
                </div>

                <button type="submit">SIGN IN</button>

                <p id="login-message"></p>

            </form>

            <a href="index.html" class="back-link">
                ← Back to Website
            </a>

        </div>

        <div class="login-footer">
            © 2026 MOATAZ MEDHAT. ALL RIGHTS RESERVED.
        </div>

    </section>

    <script type="module" src="js/login.js"></script>

</body>
</html>
